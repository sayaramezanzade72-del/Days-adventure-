<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Days of the Week Adventure</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#74d9ff,#a78bfa,#ff9ecf);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  overflow-x:hidden;
}

body:before,
body:after{
  content:"";
  position:fixed;
  border-radius:50%;
  z-index:-1;
}

body:before{
  width:220px;
  height:220px;
  background:rgba(255,255,255,.18);
  top:-70px;
  left:-60px;
}

body:after{
  width:300px;
  height:300px;
  background:rgba(255,255,255,.15);
  bottom:-130px;
  right:-100px;
}

.game{
  width:100%;
  max-width:850px;
  background:rgba(255,255,255,.95);
  border-radius:30px;
  padding:22px;
  box-shadow:0 18px 50px rgba(50,30,100,.25);
  position:relative;
  overflow:hidden;
}

.decor{
  position:absolute;
  font-size:30px;
  animation:float 3s ease-in-out infinite;
  pointer-events:none;
}

.d1{top:15px;left:20px}
.d2{top:20px;right:25px;animation-delay:.5s}
.d3{bottom:15px;left:25px;animation-delay:1s}
.d4{bottom:20px;right:25px;animation-delay:1.5s}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-10px) rotate(5deg)}
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

/* START */

.start-screen{
  text-align:center;
  padding:35px 10px 25px;
}

.logo{
  font-size:65px;
  margin-bottom:10px;
}

h1{
  font-size:clamp(30px,7vw,52px);
  color:#5b4bb7;
  margin-bottom:8px;
}

.subtitle{
  color:#666;
  font-size:18px;
  margin-bottom:28px;
}

.name-box{
  max-width:420px;
  margin:auto;
}

.name-box label{
  display:block;
  font-weight:bold;
  color:#555;
  margin-bottom:8px;
  font-size:17px;
}

input{
  width:100%;
  border:3px solid #ddd;
  border-radius:18px;
  padding:15px;
  font-size:18px;
  text-align:center;
  outline:none;
}

input:focus{
  border-color:#7c6ee6;
}

.start-btn,
.play-btn{
  margin-top:18px;
  width:100%;
  border:none;
  border-radius:18px;
  padding:16px;
  font-size:20px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg,#7c6ee6,#ef72b6);
  cursor:pointer;
  box-shadow:0 7px 0 #5949ad;
  transition:.15s;
}

.start-btn:active,
.play-btn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #5949ad;
}

.teacher{
  margin-top:25px;
  color:#777;
  font-size:15px;
  font-weight:bold;
}

/* GAME HEADER */

.game-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
  flex-wrap:wrap;
}

.badge{
  background:#7c6ee6;
  color:white;
  padding:9px 14px;
  border-radius:20px;
  font-weight:bold;
  font-size:14px;
}

.score{
  background:#fff2a8;
  color:#745900;
  padding:9px 14px;
  border-radius:20px;
  font-weight:bold;
}

.lives{
  font-size:21px;
  white-space:nowrap;
}

.progress-wrap{
  height:10px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.progress{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#5ed6ff,#7c6ee6,#ef72b6);
  transition:.3s;
}

/* TIMER */

.timer-box{
  position:relative;
  height:13px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:22px;
}

.timer-bar{
  height:100%;
  width:100%;
  background:#55d68a;
  transition:width 1s linear;
}

.timer-text{
  text-align:center;
  font-size:16px;
  font-weight:bold;
  margin-top:-2px;
  margin-bottom:15px;
  color:#555;
}

/* QUESTION */

.question-area{
  text-align:center;
  min-height:390px;
}

.stage-icon{
  font-size:48px;
  margin-bottom:5px;
}

.question-title{
  font-size:25px;
  color:#444;
  margin-bottom:18px;
  font-weight:bold;
}

.day-word{
  display:inline-block;
  font-size:clamp(42px,10vw,75px);
  font-weight:900;
  color:#6254c7;
  background:#f1efff;
  border-radius:25px;
  padding:15px 28px;
  margin:5px 0 22px;
  box-shadow:0 8px 0 #d7d1ff;
}

/* BUTTONS */

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
  max-width:600px;
  margin:auto;
}

.option-btn{
  border:3px solid #e2ddff;
  background:white;
  border-radius:18px;
  padding:16px 10px;
  font-size:20px;
  font-weight:bold;
  color:#555;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 5px 0 #ddd8f7;
}

.option-btn:hover{
  transform:translateY(-2px);
  border-color:#8b7ce8;
}

.option-btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #ddd8f7;
}

.listen-btn,
.mic-btn{
  border:none;
  border-radius:50%;
  width:115px;
  height:115px;
  font-size:45px;
  cursor:pointer;
  background:linear-gradient(135deg,#68d9ff,#8272ef);
  color:white;
  box-shadow:0 9px 0 #5949ad;
  transition:.15s;
}

.listen-btn:active,
.mic-btn:active{
  transform:translateY(6px);
  box-shadow:0 3px 0 #5949ad;
}

.instruction{
  color:#777;
  font-size:17px;
  margin:10px auto 20px;
}

.speech-status{
  margin-top:15px;
  min-height:25px;
  color:#666;
  font-weight:bold;
}

/* SPELLING */

.letters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  max-width:650px;
  margin:15px auto;
}

.letter-btn{
  width:58px;
  height:58px;
  border:none;
  border-radius:15px;
  background:#ffd86b;
  color:#5d4a00;
  font-size:24px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 #d8ad3d;
}

.letter-btn.used{
  opacity:.35;
  transform:scale(.9);
  pointer-events:none;
}

.answer-box{
  min-height:58px;
  max-width:600px;
  margin:15px auto;
  padding:10px;
  border:3px dashed #b9b0f4;
  border-radius:18px;
  background:#faf9ff;
  font-size:28px;
  font-weight:bold;
  color:#6254c7;
  letter-spacing:3px;
}

/* ORDER */

.order-buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  max-width:700px;
  margin:20px auto;
}

.order-btn{
  border:none;
  border-radius:17px;
  padding:14px 17px;
  background:#8be1c0;
  color:#185b47;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 0 #52b28f;
}

.order-btn.selected{
  background:#cfc8ff;
  color:#5a4db1;
  box-shadow:0 5px 0 #a39ae7;
}

.selected-order{
  min-height:45px;
  margin:15px auto;
  color:#6254c7;
  font-size:18px;
  font-weight:bold;
}

/* FEEDBACK */

.feedback{
  min-height:35px;
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
}

.good{
  color:#19a866;
  animation:pop .4s;
}

.bad{
  color:#e65368;
  animation:shake .4s;
}

@keyframes pop{
  0%{transform:scale(.7)}
  100%{transform:scale(1)}
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}

/* END */

.end-screen{
  text-align:center;
  padding:40px 10px;
}

.end-emoji{
  font-size:75px;
  margin-bottom:10px;
}

.end-screen h2{
  color:#6254c7;
  font-size:40px;
  margin-bottom:10px;
}

.final-score{
  font-size:25px;
  color:#555;
  margin:20px 0;
  font-weight:bold;
}

.confetti{
  position:fixed;
  top:-20px;
  font-size:25px;
  animation:fall 3s linear forwards;
  pointer-events:none;
  z-index:999;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

.hidden{
  display:none!important;
}

@media(max-width:520px){
  .game{
    padding:16px;
    border-radius:23px;
  }

  .options{
    grid-template-columns:1fr;
  }

  .option-btn{
    padding:13px;
  }

  .question-area{
    min-height:400px;
  }

  .letter-btn{
    width:48px;
    height:48px;
    font-size:20px;
  }

  .order-btn{
    font-size:15px;
    padding:12px 13px;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="decor d1">⭐</div>
  <div class="decor d2">🌈</div>
  <div class="decor d3">☁️</div>
  <div class="decor d4">✨</div>

  <!-- START -->
  <section id="startScreen" class="screen active start-screen">

    <div class="logo">📅🌈⭐</div>

    <h1>Days of the Week</h1>

    <p class="subtitle">
      Listen • Read • Speak • Spell • Order
    </p>

    <div class="name-box">

      <label for="playerName">Enter Your Name</label>

      <input
        id="playerName"
        type="text"
        maxlength="20"
        placeholder="Your name"
      >

      <button class="start-btn" onclick="startGame()">
        🚀 Start Adventure
      </button>

    </div>

    <div class="teacher">
      Teacher: Ms. Ramezanzadeh
    </div>

  </section>


  <!-- GAME -->
  <section id="gameScreen" class="screen">

    <div class="game-header">

      <div id="stageBadge" class="badge">
        Stage 1 of 5
      </div>

      <div id="score" class="score">
        ⭐ Score: 0
      </div>

      <div id="lives" class="lives">
        ❤️❤️❤️❤️❤️
      </div>

    </div>

    <div class="progress-wrap">
      <div id="progress" class="progress"></div>
    </div>

    <div class="timer-box">
      <div id="timerBar" class="timer-bar"></div>
    </div>

    <div id="timerText" class="timer-text">
      ⏰ 30 seconds
    </div>

    <div id="questionArea" class="question-area"></div>

    <div id="feedback" class="feedback"></div>

  </section>


  <!-- END -->
  <section id="endScreen" class="screen end-screen">

    <div id="endEmoji" class="end-emoji">🏆</div>

    <h2 id="endTitle">Amazing!</h2>

    <p id="endMessage">
      You completed the adventure!
    </p>

    <div id="finalScore" class="final-score">
      ⭐ Score: 0
    </div>

    <button class="play-btn" onclick="location.reload()">
      🔄 Play Again
    </button>

    <div class="teacher">
      Ms. Ramezanzadeh
    </div>

  </section>

</div>


<script>

/* =========================
   GAME DATA
========================= */

const days = [
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday",
  "Sunday"
];

let stage = 1;
let questionIndex = 0;

let lives = 5;
let score = 0;

let timeLeft = 30;
let timerInterval = null;

let currentDay = "";
let selectedLetters = [];
let selectedOrder = [];

let questionLocked = false;
let transitionInProgress = false;

let recognition = null;


/* =========================
   HELPERS
========================= */

function shuffle(array){
  return [...array].sort(() => Math.random() - 0.5);
}

function normalize(text){
  return text
    .toLowerCase()
    .trim()
    .replace(/[.,!?]/g,"")
    .replace(/\s+/g," ");
}

function stageQuestionCount(){

  if(stage === 4) return 1;

  return 7;
}

function updateHUD(){

  document.getElementById("score").textContent =
    "⭐ Score: " + score;

  document.getElementById("lives").textContent =
    "❤️".repeat(lives) + "🖤".repeat(5-lives);

  document.getElementById("stageBadge").textContent =
    "Stage " + stage + " of 5";

  const total = stageQuestionCount();

  const percent =
    ((questionIndex + 1) / total) * 100;

  document.getElementById("progress").style.width =
    percent + "%";
}


/* =========================
   START GAME
========================= */

function startGame(){

  const name =
    document.getElementById("playerName").value.trim();

  if(!name){
    document.getElementById("playerName").focus();
    return;
  }

  stage = 1;
  questionIndex = 0;
  lives = 5;
  score = 0;

  document.getElementById("startScreen")
    .classList.remove("active");

  document.getElementById("gameScreen")
    .classList.add("active");

  showQuestion();
}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  clearInterval(timerInterval);
  stopRecognition();

  questionLocked = false;
  transitionInProgress = false;

  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";

  updateHUD();

  if(stage === 1){
    showListenQuestion();
  }
  else if(stage === 2){
    showSpeakQuestion();
  }
  else if(stage === 3){
    showSpellQuestion();
  }
  else if(stage === 4){
    showOrderQuestion();
  }
  else if(stage === 5){
    showFinalQuestion();
  }

  startTimer();
}


/* =========================
   TIMER
========================= */

function startTimer(){

  clearInterval(timerInterval);

  timeLeft = 30;

  const bar =
    document.getElementById("timerBar");

  const text =
    document.getElementById("timerText");

  bar.style.width = "100%";
  text.textContent = "⏰ 30 seconds";

  timerInterval = setInterval(() => {

    timeLeft--;

    bar.style.width =
      (timeLeft / 30 * 100) + "%";

    text.textContent =
      "⏰ " + timeLeft + " seconds";

    if(timeLeft <= 0){

      clearInterval(timerInterval);

      loseLife("⏰ Time's up!");

    }

  },1000);
}


/* =========================
   STAGE 1
   LISTEN & CHOOSE
========================= */

function showListenQuestion(){

  currentDay = days[questionIndex];

  const area =
    document.getElementById("questionArea");

  let choices =
    shuffle([
      currentDay,
      ...shuffle(
        days.filter(d => d !== currentDay)
      ).slice(0,3)
    ]);

  area.innerHTML = `

    <div class="stage-icon">🎧</div>

    <div class="question-title">
      Listen and choose the day.
    </div>

    <button class="listen-btn"
      onclick="speakDay()">
      🔊
    </button>

    <div class="instruction">
      Tap the speaker and listen carefully!
    </div>

    <div class="options">

      ${choices.map(day => `
        <button
          class="option-btn"
          onclick="checkListen('${day}')">
          ${day}
        </button>
      `).join("")}

    </div>
  `;

  setTimeout(() => speakDay(), 350);
}


function speakDay(){

  if(questionLocked) return;

  if(!("speechSynthesis" in window)){
    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(currentDay);

  utterance.lang = "en-US";
  utterance.rate = 0.75;
  utterance.pitch = 1.1;

  window.speechSynthesis.speak(utterance);
}


function checkListen(answer){

  if(questionLocked || transitionInProgress)
    return;

  if(answer === currentDay){

    correctAnswer();

  }else{

    loseLife("❌ Try again!");
  }
}


/* =========================
   STAGE 2
   READ & SAY
========================= */

function showSpeakQuestion(){

  currentDay = days[questionIndex];

  const area =
    document.getElementById("questionArea");

  area.innerHTML = `

    <div class="stage-icon">🎤</div>

    <div class="question-title">
      Read the word aloud!
    </div>

    <div class="day-word">
      ${currentDay}
    </div>

    <div class="instruction">
      Tap the microphone and say the word.
    </div>

    <button class="mic-btn"
      onclick="startRecognition()">
      🎤
    </button>

    <div id="speechStatus" class="speech-status">
      Tap the microphone to speak.
    </div>
  `;
}


function startRecognition(){

  if(questionLocked || transitionInProgress)
    return;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const status =
    document.getElementById("speechStatus");

  if(!SpeechRecognition){

    status.textContent =
      "⚠️ Please use Google Chrome for voice checking.";

    return;
  }

  stopRecognition();

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  status.textContent =
    "🎤 Listening... Say " + currentDay;

  try{
    recognition.start();
  }catch(error){
    status.textContent =
      "Tap the microphone again.";
  }

  recognition.onresult = function(event){

    if(questionLocked || transitionInProgress)
      return;

    let heardCorrect = false;
    let heardText = "";

    const results =
      event.results[0];

    for(let i=0; i<results.length; i++){

      const transcript =
        normalize(results[i].transcript);

      if(i === 0){
        heardText = transcript;
      }

      if(transcript === normalize(currentDay)){
        heardCorrect = true;
      }
    }

    if(heardCorrect){

      correctAnswer();

    }else{

      loseLife(
        "❌ I heard: " +
        (heardText || "something") +
        ". Try again!"
      );
    }
  };

  recognition.onerror = function(event){

    if(event.error === "no-speech"){

      status.textContent =
        "I didn't hear you. Try again! 🎤";

      return;
    }

    if(event.error === "not-allowed" ||
       event.error === "service-not-allowed"){

      status.textContent =
        "🎤 Please allow microphone access and try again.";

      return;
    }

    status.textContent =
      "Tap the microphone and try again.";
  };

  recognition.onend = function(){

    recognition = null;

  };
}


function stopRecognition(){

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

    recognition = null;
  }
}


/* =========================
   STAGE 3
   SPELL IT
========================= */

function showSpellQuestion(){

  currentDay = days[questionIndex];

  selectedLetters = [];

  const letters =
    shuffle(currentDay.toUpperCase().split(""));

  const area =
    document.getElementById("questionArea");

  area.innerHTML = `

    <div class="stage-icon">✏️</div>

    <div class="question-title">
      Spell the day!
    </div>

    <div class="day-word">
      ${currentDay}
    </div>

    <div class="instruction">
      Tap the letters in the correct order.
    </div>

    <div id="answerBox" class="answer-box">
      _ _ _ _ _
    </div>

    <div class="letters">

      ${letters.map((letter,index) => `
        <button
          class="letter-btn"
          id="letter-${index}"
          onclick="chooseLetter('${letter}',${index})">
          ${letter}
        </button>
      `).join("")}

    </div>
  `;
}


function chooseLetter(letter,index){

  if(questionLocked || transitionInProgress)
    return;

  const button =
    document.getElementById("letter-" + index);

  if(button.classList.contains("used"))
    return;

  button.classList.add("used");

  selectedLetters.push({
    letter:letter,
    index:index
  });

  const typed =
    selectedLetters
      .map(x => x.letter)
      .join("");

  const answerBox =
    document.getElementById("answerBox");

  answerBox.textContent = typed;

  if(selectedLetters.length === currentDay.length){

    if(
      typed.toLowerCase() ===
      currentDay.toLowerCase()
    ){

      correctAnswer();

    }else{

      loseLife("❌ Check the spelling!");

    }
  }
}


/* =========================
   STAGE 4
   PUT THEM IN ORDER
========================= */

function showOrderQuestion(){

  selectedOrder = [];

  const shuffledDays =
    shuffle(days);

  const area =
    document.getElementById("questionArea");

  area.innerHTML = `

    <div class="stage-icon">🔢</div>

    <div class="question-title">
      Put the days in order.
    </div>

    <div class="instruction">
      Tap them from Monday to Sunday.
    </div>

    <div class="selected-order"
         id="selectedOrder">
      Your order will appear here.
    </div>

    <div class="order-buttons">

      ${shuffledDays.map((day,index) => `
        <button
          class="order-btn"
          id="order-${index}"
          onclick="chooseOrder('${day}',${index})">
          ${day}
        </button>
      `).join("")}

    </div>
  `;
}


function chooseOrder(day,index){

  if(questionLocked || transitionInProgress)
    return;

  const expected =
    days[selectedOrder.length];

  if(day === expected){

    selectedOrder.push(day);

    document
      .getElementById("order-" + index)
      .classList.add("selected");

    document.getElementById("selectedOrder")
      .textContent =
      selectedOrder.join(" → ");

    if(selectedOrder.length === days.length){

      correctAnswer();

    }

  }else{

    loseLife("❌ Not yet! Start again.");

  }
}


/* =========================
   STAGE 5
   FINAL CHALLENGE
========================= */

let finalDays = [];
let finalTypes = [];


function setupFinalStage(){

  finalDays = shuffle(days);

  finalTypes = shuffle([
    "listen",
    "speak",
    "spell",
    "listen",
    "speak",
    "spell",
    "listen"
  ]);
}


function showFinalQuestion(){

  if(questionIndex === 0){
    setupFinalStage();
  }

  currentDay =
    finalDays[questionIndex];

  const type =
    finalTypes[questionIndex];

  if(type === "listen"){
    showFinalListen();
  }
  else if(type === "speak"){
    showFinalSpeak();
  }
  else{
    showFinalSpell();
  }
}


/* FINAL LISTEN */

function showFinalListen(){

  const area =
    document.getElementById("questionArea");

  let choices =
    shuffle([
      currentDay,
      ...shuffle(
        days.filter(d => d !== currentDay)
      ).slice(0,3)
    ]);

  area.innerHTML = `

    <div class="stage-icon">🏆🎧</div>

    <div class="question-title">
      Final Challenge: Listen!
    </div>

    <button class="listen-btn"
      onclick="speakDay()">
      🔊
    </button>

    <div class="instruction">
      Listen and choose the correct day.
    </div>

    <div class="options">

      ${choices.map(day => `
        <button
          class="option-btn"
          onclick="checkFinalListen('${day}')">
          ${day}
        </button>
      `).join("")}

    </div>
  `;

  setTimeout(() => speakDay(),300);
}


function checkFinalListen(answer){

  if(answer === currentDay){
    correctAnswer();
  }else{
    loseLife("❌ Try again!");
  }
}


/* FINAL SPEAK */

function showFinalSpeak(){

  const area =
    document.getElementById("questionArea");

  area.innerHTML = `

    <div class="stage-icon">🏆🎤</div>

    <div class="question-title">
      Final Challenge: Speak!
    </div>

    <div class="day-word">
      ${currentDay}
    </div>

    <div class="instruction">
      Read the day aloud.
    </div>

    <button class="mic-btn"
      onclick="startRecognition()">
      🎤
    </button>

    <div id="speechStatus" class="speech-status">
      Tap and speak!
    </div>
  `;
}


/* FINAL SPELL */

function showFinalSpell(){

  selectedLetters = [];

  const letters =
    shuffle(currentDay.toUpperCase().split(""));

  const area =
    document.getElementById("questionArea");

  area.innerHTML = `

    <div class="stage-icon">🏆✏️</div>

    <div class="question-title">
      Final Challenge: Spell!
    </div>

    <div class="day-word">
      ${currentDay}
    </div>

    <div class="instruction">
      Spell the word correctly.
    </div>

    <div id="answerBox" class="answer-box">
      _
    </div>

    <div class="letters">

      ${letters.map((letter,index) => `
        <button
          class="letter-btn"
          id="letter-${index}"
          onclick="chooseLetter('${letter}',${index})">
          ${letter}
        </button>
      `).join("")}

    </div>
  `;
}


/* =========================
   CORRECT ANSWER
========================= */

function correctAnswer(){

  if(questionLocked || transitionInProgress)
    return;

  questionLocked = true;
  transitionInProgress = true;

  clearInterval(timerInterval);
  stopRecognition();

  score += 10;

  updateHUD();

  playWinSound();

  const feedback =
    document.getElementById("feedback");

  feedback.textContent =
    "🎉 Excellent! Great job!";

  feedback.className =
    "feedback good";

  setTimeout(() => {

    nextQuestion();

  },800);
}


/* =========================
   LOSE LIFE
========================= */

function loseLife(message){

  if(questionLocked || transitionInProgress)
    return;

  transitionInProgress = true;

  clearInterval(timerInterval);
  stopRecognition();

  lives--;

  updateHUD();

  playLoseSound();

  const feedback =
    document.getElementById("feedback");

  feedback.textContent = message;

  feedback.className =
    "feedback bad";

  if(lives <= 0){

    setTimeout(() => {
      gameOver();
    },900);

    return;
  }

  /*
    IMPORTANT:
    The same question is shown again.
    The child gets another 30 seconds.
  */

  setTimeout(() => {

    transitionInProgress = false;

    showQuestion();

  },900);
}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

  if(stage === 1){

    questionIndex++;

    if(questionIndex >= 7){

      stage = 2;
      questionIndex = 0;
    }

  }

  else if(stage === 2){

    questionIndex++;

    if(questionIndex >= 7){

      stage = 3;
      questionIndex = 0;
    }

  }

  else if(stage === 3){

    questionIndex++;

    if(questionIndex >= 7){

      stage = 4;
      questionIndex = 0;
    }

  }

  else if(stage === 4){

    stage = 5;
    questionIndex = 0;
    setupFinalStage();

  }

  else if(stage === 5){

    questionIndex++;

    if(questionIndex >= 7){

      winGame();
      return;
    }
  }

  showQuestion();
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  clearInterval(timerInterval);
  stopRecognition();

  document.getElementById("gameScreen")
    .classList.remove("active");

  document.getElementById("endScreen")
    .classList.add("active");

  document.getElementById("endEmoji")
    .textContent = "😢";

  document.getElementById("endTitle")
    .textContent = "Game Over";

  document.getElementById("endMessage")
    .textContent =
    "Don't worry! You can try again.";

  document.getElementById("finalScore")
    .textContent =
    "⭐ Score: " + score;
}


/* =========================
   WIN
========================= */

function winGame(){

  clearInterval(timerInterval);
  stopRecognition();

  document.getElementById("gameScreen")
    .classList.remove("active");

  document.getElementById("endScreen")
    .classList.add("active");

  document.getElementById("endEmoji")
    .textContent = "🏆🎉🌈";

  document.getElementById("endTitle")
    .textContent = "Amazing Job!";

  document.getElementById("endMessage")
    .textContent =
    "You completed all 5 stages!";

  document.getElementById("finalScore")
    .textContent =
    "⭐ Score: " + score;

  playWinSound();

  createConfetti();
}


/* =========================
   SOUND EFFECTS
========================= */

let audioContext = null;

function getAudio(){

  if(!audioContext){

    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();
  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

  return audioContext;
}


function tone(freq,duration,type="sine"){

  try{

    const ctx = getAudio();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type = type;
    oscillator.frequency.value = freq;

    gain.gain.setValueAtTime(
      0.001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();
    oscillator.stop(ctx.currentTime + duration);

  }catch(e){}
}


function playWinSound(){

  tone(523,0.12);
  setTimeout(() => tone(659,0.12),120);
  setTimeout(() => tone(784,0.20),240);
}


function playLoseSound(){

  tone(260,0.18,"sawtooth");
  setTimeout(() => tone(190,0.25,"sawtooth"),150);
}


/* =========================
   CONFETTI
========================= */

function createConfetti(){

  const symbols = [
    "🎉","⭐","🌈","✨","🎈","🏆","💫"
  ];

  for(let i=0;i<35;i++){

    const piece =
      document.createElement("div");

    piece.className = "confetti";

    piece.textContent =
      symbols[Math.floor(
        Math.random()*symbols.length
      )];

    piece.style.left =
      Math.random()*100 + "vw";

    piece.style.animationDuration =
      (2 + Math.random()*2) + "s";

    piece.style.animationDelay =
      Math.random()*1.5 + "s";

    document.body.appendChild(piece);

    setTimeout(() => {
      piece.remove();
    },5000);
  }
}
