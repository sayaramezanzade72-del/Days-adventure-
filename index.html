<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Days of the Week Adventure</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
display:flex;
justify-content:center;
align-items:center;
padding:15px;
}

.game{
width:100%;
max-width:850px;
min-height:650px;
background:white;
border-radius:30px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

header{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
padding:22px;
text-align:center;
color:white;
}

header h1{
font-size:32px;
text-shadow:2px 3px 4px rgba(0,0,0,.2);
}

.teacher{
margin-top:6px;
font-weight:bold;
}

.screen{
padding:25px;
min-height:560px;
}

.hidden{
display:none!important;
}

/* START */

.start-box{
text-align:center;
padding-top:70px;
}

.big-icon{
font-size:90px;
}

.start-box h2{
font-size:30px;
color:#555;
margin:20px 0 25px;
}

.name-input{
width:90%;
max-width:400px;
padding:16px;
border:3px solid #ffd166;
border-radius:18px;
font-size:18px;
text-align:center;
outline:none;
}

.start-btn{
display:block;
margin:25px auto;
padding:16px 40px;
border:0;
border-radius:20px;
background:#06d6a0;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 0 #05a77d;
}

/* GAME INFO */

.top-info{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.info{
background:#f1f5f9;
padding:9px 14px;
border-radius:15px;
font-weight:bold;
color:#444;
}

.stage-title{
text-align:center;
font-size:25px;
color:#555;
margin:10px 0 15px;
}

.progress{
height:12px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#06d6a0,#118ab2);
transition:.3s;
}

.timer-box{
text-align:center;
margin-bottom:15px;
}

.timer{
display:inline-block;
background:#ff6b6b;
color:white;
padding:8px 22px;
border-radius:20px;
font-size:20px;
font-weight:bold;
}

/* QUESTION */

.question-card{
background:linear-gradient(135deg,#fff7ad,#ffe29f);
border-radius:25px;
padding:25px;
min-height:390px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.instruction{
font-size:21px;
color:#555;
font-weight:bold;
margin-bottom:20px;
}

.day-word{
font-size:48px;
font-weight:900;
color:#118ab2;
margin:15px 0;
}

.choice-container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
width:100%;
max-width:600px;
}

.choice{
border:0;
padding:17px 10px;
border-radius:18px;
background:white;
font-size:22px;
font-weight:bold;
color:#444;
cursor:pointer;
box-shadow:0 5px 0 #ddd;
}

.choice:active{
transform:translateY(3px);
}

.speaker-btn,
.mic-btn{
width:85px;
height:85px;
border:0;
border-radius:50%;
font-size:38px;
cursor:pointer;
margin:8px;
box-shadow:0 5px 0 rgba(0,0,0,.15);
}

.speaker-btn{
background:#ffd166;
}

.mic-btn{
background:#ef476f;
color:white;
}

.mic-btn.listening{
background:#06d6a0;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{transform:scale(1.12)}
}

.voice-result{
background:white;
border-radius:15px;
padding:12px 20px;
margin-top:15px;
font-size:18px;
color:#555;
min-height:45px;
max-width:600px;
}

.feedback{
margin-top:15px;
min-height:35px;
font-size:21px;
font-weight:bold;
}

.good{
color:#06a77d;
}

.bad{
color:#ef476f;
}

/* SPELLING */

.letter-answer{
min-height:55px;
width:100%;
max-width:600px;
background:white;
border-radius:15px;
padding:10px;
font-size:30px;
font-weight:bold;
letter-spacing:5px;
color:#118ab2;
margin-bottom:20px;
}

.letter-container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
max-width:650px;
}

.letter-btn{
width:55px;
height:55px;
border:0;
border-radius:15px;
background:#118ab2;
color:white;
font-size:23px;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 0 #075b78;
}

.letter-btn.used{
opacity:.3;
pointer-events:none;
}

/* ORDER */

.order-container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
max-width:700px;
}

.order-btn{
border:0;
background:white;
padding:13px 18px;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 0 #ddd;
}

.order-btn.selected{
background:#06d6a0;
color:white;
pointer-events:none;
}

/* END */

.end-box{
text-align:center;
padding-top:70px;
}

.end-icon{
font-size:100px;
}

.end-box h2{
font-size:38px;
color:#118ab2;
margin:15px;
}

.end-box p{
font-size:23px;
color:#555;
margin:10px;
}

.restart{
margin-top:25px;
padding:15px 35px;
border:0;
border-radius:18px;
background:#118ab2;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

/* CONFETTI */

.confetti{
position:fixed;
top:-30px;
font-size:25px;
animation:fall 3s linear forwards;
pointer-events:none;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

@media(max-width:600px){

header h1{
font-size:25px;
}

.screen{
padding:15px;
}

.day-word{
font-size:38px;
}

.choice-container{
grid-template-columns:1fr;
}

.choice{
font-size:19px;
}

.letter-btn{
width:48px;
height:48px;
}

.order-btn{
font-size:15px;
padding:11px;
}
}
</style>
</head>

<body>

<div class="game">

<header>
<h1>🌈 Days of the Week Adventure 🌈</h1>
<div class="teacher">👩‍🏫 Ms. Ramezanzadeh</div>
</header>

<!-- START -->

<div id="startScreen" class="screen">

<div class="start-box">

<div class="big-icon">📅✨</div>

<h2>Let's Learn the Days!</h2>

<input
id="playerName"
class="name-input"
placeholder="Enter Your Name"
maxlength="20">

<button class="start-btn" onclick="startGame()">
🚀 START GAME
</button>

<p style="color:#777;">
👂 Listen • 📖 Read • 🎤 Speak • ✏️ Spell • 🔤 Order
</p>

</div>

</div>


<!-- GAME -->

<div id="gameScreen" class="screen hidden">

<div class="top-info">

<div class="info">
👧 <span id="nameDisplay"></span>
</div>

<div class="info">
❤️ <span id="livesDisplay">5</span>
</div>

<div class="info">
⭐ <span id="scoreDisplay">0</span>
</div>

</div>

<div id="stageTitle" class="stage-title"></div>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<div class="timer-box">
<div class="timer">
⏰ <span id="timer">30</span>
</div>
</div>

<div id="questionCard" class="question-card"></div>

</div>


<!-- END -->

<div id="endScreen" class="screen hidden">

<div class="end-box">

<div id="endIcon" class="end-icon">🏆</div>

<h2 id="endTitle"></h2>

<p id="endMessage"></p>

<p>
⭐ Score:
<strong id="finalScore"></strong>
</p>

<button class="restart" onclick="location.reload()">
🔄 PLAY AGAIN
</button>

</div>

</div>

</div>


<script>

const days=[
"Monday",
"Tuesday",
"Wednesday",
"Thursday",
"Friday",
"Saturday",
"Sunday"
];

let playerName="";
let stage=1;
let questionIndex=0;
let lives=5;
let score=0;
let timeLeft=30;

let timerInterval=null;
let recognition=null;

let currentDay="";
let selectedLetters="";
let questionLocked=false;

const QUESTIONS_PER_STAGE=4;
const TOTAL_QUESTIONS=20;


/* START */

function startGame(){

playerName=
document.getElementById("playerName").value.trim();

if(!playerName){

document.getElementById("playerName").focus();

return;
}

document.getElementById("startScreen")
.classList.add("hidden");

document.getElementById("gameScreen")
.classList.remove("hidden");

document.getElementById("nameDisplay")
.textContent=playerName;

showQuestion();

}


/* RANDOM */

function randomDay(){

return days[
Math.floor(Math.random()*days.length)
];

}


/* SHOW QUESTION */

function showQuestion(){

stopTimer();
stopRecognition();

questionLocked=false;
timeLeft=30;

updateUI();

const card=
document.getElementById("questionCard");


if(stage===1){

document.getElementById("stageTitle").textContent=
"Stage 1 — 👂 Listen & Choose";

stageOne(card);

}

else if(stage===2){

document.getElementById("stageTitle").textContent=
"Stage 2 — 🎤 Read It & Speak";

stageTwo(card);

}

else if(stage===3){

document.getElementById("stageTitle").textContent=
"Stage 3 — ✏️ Spell It";

stageThree(card);

}

else if(stage===4){

document.getElementById("stageTitle").textContent=
"Stage 4 — 🔤 Put Them in Order";

stageFour(card);

}

else{

document.getElementById("stageTitle").textContent=
"Stage 5 — 🏆 Final Challenge";

stageFive(card);

}

startTimer();

}


/* TIMER */

function startTimer(){

stopTimer();

updateTimer();

timerInterval=setInterval(()=>{

timeLeft--;

updateTimer();

if(timeLeft<=0){

stopTimer();

loseLife("⏰ Time's up!");

}

},1000);

}

function stopTimer(){

if(timerInterval){

clearInterval(timerInterval);
timerInterval=null;

}

}

function updateTimer(){

document.getElementById("timer")
.textContent=timeLeft;

}


/* UI */

function updateUI(){

document.getElementById("livesDisplay")
.textContent=lives;

document.getElementById("scoreDisplay")
.textContent=score;

let completed=
(stage-1)*QUESTIONS_PER_STAGE+
questionIndex;

document.getElementById("progressBar")
.style.width=
(completed/TOTAL_QUESTIONS*100)+"%";

}


/* LOCK */

function lockQuestion(){

questionLocked=true;

stopTimer();
stopRecognition();

}


/* CORRECT */

function correctAnswer(points){

if(questionLocked)return;

lockQuestion();

score+=points;

updateUI();

const feedback=
document.querySelector(".feedback");

if(feedback){

feedback.textContent=
"🎉 Excellent! Great job!";

feedback.className=
"feedback good";

}

setTimeout(nextQuestion,850);

}


/* WRONG */

function loseLife(message){

if(questionLocked)return;

lockQuestion();

lives--;

updateUI();

const feedback=
document.querySelector(".feedback");

if(feedback){

feedback.textContent=
message+" ❤️ -1 life";

feedback.className=
"feedback bad";

}

if(lives<=0){

setTimeout(gameOver,900);

}else{

setTimeout(nextQuestion,1000);

}

}


/* NEXT */

function nextQuestion(){

questionIndex++;

if(questionIndex>=QUESTIONS_PER_STAGE){

if(stage===5){

winGame();
return;

}

stage++;
questionIndex=0;

}

showQuestion();

}


/* ==================================================
STAGE 1
================================================== */

function stageOne(card){

currentDay=randomDay();

card.innerHTML=`

<div class="instruction">
👂 Listen carefully!
</div>

<div style="font-size:65px;">🔊</div>

<p>
Listen to the day and choose the correct word.
</p>

<button class="speaker-btn"
onclick="speakCurrentDay()">
🔊
</button>

<div id="choices"
class="choice-container">
</div>

<div class="feedback"></div>
`;

createChoices();

setTimeout(speakCurrentDay,300);

}


/* CHOICES */

function createChoices(){

const choices=[currentDay];

while(choices.length<4){

let d=randomDay();

if(!choices.includes(d)){
choices.push(d);
}

}

shuffle(choices);

const container=
document.getElementById("choices");

choices.forEach(day=>{

const button=
document.createElement("button");

button.className="choice";
button.textContent=day;

button.onclick=()=>{

if(day===currentDay){

correctAnswer(10);

}else{

loseLife("❌ Wrong answer!");

}

};

container.appendChild(button);

});

}


/* SPEAK */

function speakCurrentDay(){

if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

const voice=
new SpeechSynthesisUtterance(currentDay);

voice.lang="en-US";
voice.rate=.75;

speechSynthesis.speak(voice);

}


/* ==================================================
STAGE 2 — REAL VOICE CHECK
================================================== */

function stageTwo(card){

currentDay=randomDay();

card.innerHTML=`

<div class="instruction">
📖 Read the word aloud!
</div>

<div class="day-word">
${currentDay}
</div>

<p>
Tap 🎤 and say the word.
</p>

<div>

<button
id="micButton"
class="mic-btn"
onclick="startReading()">
🎤
</button>

<button
class="speaker-btn"
onclick="speakCurrentDay()">
🔊
</button>

</div>

<div id="voiceResult"
class="voice-result">
🎤 Tap the microphone and read the word!
</div>

<div class="feedback"></div>
`;

}


/* NORMALIZE */

function normalizeSpeech(text){

return text
.toLowerCase()
.replace(/[^a-z]/g,"");

}


/* START RECOGNITION */

function startReading(){

if(questionLocked)return;

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const result=
document.getElementById("voiceResult");

const mic=
document.getElementById("micButton");


if(!SpeechRecognition){

result.innerHTML=
"❌ Voice checking is not supported here.<br>" +
"Please open this game in <strong>Google Chrome</strong>.";

return;

}


if(recognition){

try{
recognition.abort();
}catch(e){}

}


recognition=new SpeechRecognition();

recognition.lang="en-US";
recognition.continuous=false;
recognition.interimResults=false;
recognition.maxAlternatives=3;


recognition.onstart=()=>{

mic.classList.add("listening");

result.innerHTML=
"🎤 <strong>Listening...</strong>";

};


recognition.onresult=(event)=>{

if(questionLocked)return;

const results=event.results[0];

let heard=[];

for(let i=0;i<results.length;i++){

heard.push(
normalizeSpeech(results[i].transcript)
);

}

const target=
normalizeSpeech(currentDay);

const heardText=
results[0].transcript;


if(heard.includes(target)){

result.innerHTML=
"👂 I heard: <strong>"+
heardText+
"</strong>";


correctAnswer(20);

}else{

result.innerHTML=
"👂 I heard: <strong>"+
heardText+
"</strong>";

loseLife(
"❌ That's not "+currentDay+"!"
);

}

};


recognition.onnomatch=()=>{

if(questionLocked)return;

result.innerHTML=
"😕 I couldn't understand you. " +
"Tap 🎤 and try again.";

};


recognition.onerror=(event)=>{

if(questionLocked)return;

if(
event.error==="not-allowed" ||
event.error==="service-not-allowed"
){

result.innerHTML=
"🔒 Microphone permission is blocked.<br>" +
"Please allow microphone access.";

}

else if(event.error==="no-speech"){

result.innerHTML=
"👂 I didn't hear you. Tap 🎤 and try again.";

}

else{

result.innerHTML=
"⚠️ I couldn't check your voice. Try again.";

}

};


recognition.onend=()=>{

if(mic){
mic.classList.remove("listening");
}

};


try{

recognition.start();

}catch(e){

result.innerHTML=
"⚠️ Microphone could not start. Try again.";

}

}


/* STOP RECOGNITION */

function stopRecognition(){

if(recognition){

try{
recognition.abort();
}catch(e){}

recognition=null;

}

}


/* ==================================================
STAGE 3 — SPELL
================================================== */

function stageThree(card){

currentDay=randomDay();
selectedLetters="";

let letters=
currentDay.toUpperCase().split("");

shuffle(letters);

card.innerHTML=`

<div class="instruction">
✏️ Spell the day!
</div>

<div style="font-size:55px;">🧩</div>

<p>
Put the letters in the correct order.
</p>

<div id="letterAnswer"
class="letter-answer">_</div>

<div id="letters"
class="letter-container">
</div>

<div class="feedback"></div>
`;

createLetters(letters);

}


/* LETTERS */

function createLetters(letters){

const container=
document.getElementById("letters");

letters.forEach(letter=>{

const button=
document.createElement("button");

button.className="letter-btn";
button.textContent=letter;

button.onclick=()=>{

if(questionLocked)return;

selectedLetters+=letter;

button.classList.add("used");

document.getElementById("letterAnswer")
.textContent=selectedLetters;


if(selectedLetters.length===currentDay.length){

if(
selectedLetters.toLowerCase()===
currentDay.toLowerCase()
){

correctAnswer(15);

}else{

loseLife("❌ Wrong spelling!");

}

}

};

container.appendChild(button);

});

}


/* ==================================================
STAGE 4 — ORDER
================================================== */

function stageFour(card){

const shuffled=[...days];

shuffle(shuffled);

let selectedCount=0;

card.innerHTML=`

<div class="instruction">
🔤 Put the days in order!
</div>

<p>
Start with Monday and finish with Sunday.
</p>

<div id="orderContainer"
class="order-container">
</div>

<div class="feedback"></div>
`;

const container=
document.getElementById("orderContainer");

shuffled.forEach(day=>{

const button=
document.createElement("button");

button.className="order-btn";
button.textContent=day;

button.onclick=()=>{

if(questionLocked)return;

const expected=
days[selectedCount];

if(day===expected){

button.classList.add("selected");

selectedCount++;

if(selectedCount===7){

correctAnswer(20);

}

}else{

loseLife(
"❌ We need "+expected+"!"
);

}

};

container.appendChild(button);

});

}


/* ==================================================
STAGE 5
================================================== */

function stageFive(card){

const type=
Math.floor(Math.random()*3);

if(type===0){

finalListening(card);

}else if(type===1){

finalSpeaking(card);

}else{

finalSpelling(card);

}

}


/* FINAL LISTENING */

function finalListening(card){

currentDay=randomDay();

card.innerHTML=`

<div class="instruction">
🏆 FINAL LISTENING CHALLENGE!
</div>

<div style="font-size:65px;">
👂🔊
</div>

<button
class="speaker-btn"
onclick="speakCurrentDay()">
🔊
</button>

<p>
Listen and choose the correct day.
</p>

<div id="choices"
class="choice-container">
</div>

<div class="feedback"></div>
`;

createChoices();

setTimeout(speakCurrentDay,300);

}


/* FINAL SPEAKING */

function finalSpeaking(card){

currentDay=randomDay();

card.innerHTML=`

<div class="instruction">
🏆 FINAL SPEAKING CHALLENGE!
</div>

<div class="day-word">
${currentDay}
</div>

<p>
Read the day aloud.
</p>

<button
id="micButton"
class="mic-btn"
onclick="startReading()">
🎤
</button>

<button
class="speaker-btn"
onclick="speakCurrentDay()">
🔊
</button>

<div id="voiceResult"
class="voice-result">
🎤 Tap the microphone and read it!
</div>

<div class="feedback"></div>
`;

}


/* FINAL SPELLING */

function finalSpelling(card){

currentDay=randomDay();
selectedLetters="";

let letters=
currentDay.toUpperCase().split("");

shuffle(letters);

card.innerHTML=`

<div class="instruction">
🏆 FINAL SPELLING CHALLENGE!
</div>

<div class="day-word">
${currentDay.replace(/[A-Za-z]/g,"_")}
</div>

<p>
Spell the day using the letters.
</p>

<div id="letterAnswer"
class="letter-answer">_</div>

<div id="letters"
class="letter-container">
</div>

<div class="feedback"></div>
`;

createLetters(letters);

}


/* SHUFFLE */

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=
Math.floor(Math.random()*(i+1));

[array[i],array[j]]=
[array[j],array[i]];

}

}


/* GAME OVER */

function gameOver(){

stopTimer();
stopRecognition();

document.getElementById("gameScreen")
.classList.add("hidden");

document.getElementById("endScreen")
.classList.remove("hidden");

document.getElementById("endIcon")
.textContent="💔";

document.getElementById("endTitle")
.textContent="Game Over!";

document.getElementById("endMessage")
.textContent=
"Good try, "+playerName+"! 🌟";

document.getElementById("finalScore")
.textContent=score;

}


/* WIN */

function winGame(){

stopTimer();
stopRecognition();

document.getElementById("gameScreen")
.classList.add("hidden");

document.getElementById("endScreen")
.classList.remove("hidden");

document.getElementById("endIcon")
.textContent="🏆";

document.getElementById("endTitle")
.textContent=
"YOU DID IT! 🎉";

document.getElementById("endMessage")
.textContent=
"Amazing job, "+playerName+
"! You know the days of the week! 🌈";

document.getElementById("finalScore")
.textContent=score;

confetti();

}


/* CONFETTI */

function confetti(){

const icons=[
"🎉","⭐","🌈","🎈","✨","🏆"
];

for(let i=0;i<40;i++){

const item=
document.createElement("div");

item.className="confetti";

item.textContent=
icons[
Math.floor(Math.random()*icons.length)
];

item.style.left=
Math.random()*100+"vw";

item.style.animationDelay=
Math.random()*2+"s";

document.body.appendChild(item);

setTimeout(()=>{
item.remove();
},5000);

}

}

</script>

</body>
  </html>
